<div class="content p-3 pt-0">
  <!-- Contract Settings (Header Box) -->
  <div class="page-content bg-white rounded shadow-sm p-4 mb-4">
    <h5 class="text-secondary fw-bold mb-4 border-bottom pb-2">Contract Settings</h5>
    
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="row g-3">
        <div class="col-md-3 mb-3">
          <label class="form-label">Time</label>
          <input type="time" class="form-control" formControlName="time">
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label">Date</label>
          <input type="date" class="form-control" formControlName="date">
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label">Day</label>
          <input type="text" class="form-control bg-light" formControlName="day" readonly>
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label">Contract Type</label>
          <select class="form-select" formControlName="contractType">
            <option [value]="1">Daily</option>
            <option [value]="2">Weekly</option>
            <option [value]="3">Monthly</option>
            <option [value]="4">Long-term</option>
            <option [value]="5">Hourly</option>
          </select>
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label">{{ getPeriodLabel() }}</label>
          <input type="number" class="form-control" formControlName="periodInDays">
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label">Actual Period In Days</label>
          <input type="number" class="form-control bg-light" formControlName="actualPeriodInDays" readonly>
        </div>
        
        <div class="col-md-3 mb-3">
          <label class="form-label">Expected Receiving Time</label>
          <input type="time" class="form-control bg-light" formControlName="expectedReceivingTime" readonly>
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label">Expected Receiving Date</label>
          <input type="date" class="form-control bg-light" formControlName="expectedReceivingDate" readonly>
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label">Delivery Day</label>
          <input type="text" class="form-control bg-light" formControlName="deliveryDay" readonly>
        </div>
        
        <div class="col-md-3 mb-3">
          <label class="form-label">Payment Type</label>
          <select class="form-select" formControlName="paymentType">
            <option [value]="1">Cash</option>
            <option [value]="2">Credit</option>
          </select>
        </div>
        
        <div class="col-md-3 mb-3">
          <label class="form-label">With Driver</label>
          <select class="form-select" formControlName="withDriver">
            <option [value]="true">Yes</option>
            <option [value]="false">No</option>
          </select>
        </div>
        
        <div class="col-md-3 mb-3">
          <label class="form-label">Driver Name</label>
          <select class="form-select" formControlName="driverId">
            <option [value]="null">Select one from the drivers</option>
            <option *ngFor="let driver of drivers" [value]="driver.id">{{ driver.name }}</option>
          </select>
        </div>
      </div>
    </form>
  </div>

  <!-- Tabs Box -->
  <div class="page-content bg-white rounded shadow-sm p-4">
    <ul class="nav nav-pills nav-justified mb-4" style="border: 1px solid #176B6B; border-radius: 0;">
      <li class="nav-item" style="border-right: 1px solid #176B6B;">
        <a class="nav-link fw-bold rounded-0" [class.active]="activeTab === 'tenant'" (click)="switchTab('tenant')" role="button" [style.background-color]="activeTab === 'tenant' ? '#176B6B' : 'white'" [style.color]="activeTab === 'tenant' ? 'white' : '#176B6B'">Tenant</a>
      </li>
      <li class="nav-item">
        <a class="nav-link fw-bold rounded-0" [class.active]="activeTab === 'vehicle'" (click)="switchTab('vehicle')" role="button" [style.background-color]="activeTab === 'vehicle' ? '#176B6B' : 'white'" [style.color]="activeTab === 'vehicle' ? 'white' : '#176B6B'">Vehicle info</a>
      </li>
    </ul>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <!-- Tenant Tab -->
      <div [class.d-none]="activeTab !== 'tenant'">
        
        <!-- Vehicle Tenant Box -->
        <fieldset class="border rounded p-3 mb-4" style="border-color: #dee2e6 !important;">
          <legend class="float-none w-auto px-2 fs-6 text-secondary fw-bold mb-0" style="font-size: 0.9rem !important;">Vehicle Tenant</legend>
          <div class="row g-3">
            <div class="col-md-3 mb-3">
              <label class="form-label text-secondary" style="font-size: 0.85rem;">Tenant Name</label>
              <div class="d-flex align-items-center">
                <select class="form-select border-primary text-primary" formControlName="tenantId">
                  <option [value]="null">Select one</option>
                  <option *ngFor="let tenant of tenants" [value]="tenant.id">{{ tenant.name }}</option>
                </select>
                <span class="ms-2 fs-5 text-teal" style="cursor: pointer;" (click)="form.get('tenantId')?.setValue(null)">✕</span>
                <span class="ms-2 ms-1 text-teal" style="cursor: pointer;"><i class="bi bi-eye"></i></span>
              </div>
            </div>
            <div class="col-md-3 mb-3">
              <label class="form-label text-secondary" style="font-size: 0.85rem;">License number</label>
              <input type="text" class="form-control bg-white" [value]="selectedTenantLicense()" readonly>
            </div>
            <div class="col-md-3 mb-3">
              <label class="form-label text-secondary" style="font-size: 0.85rem;">Passport Number</label>
              <input type="text" class="form-control bg-white" [value]="selectedTenantPassport()" readonly>
            </div>
            <div class="col-md-3 mb-3">
              <label class="form-label text-secondary" style="font-size: 0.85rem;">Unified number</label>
              <input type="text" class="form-control bg-white" [value]="selectedTenantUnified()" readonly>
            </div>
            
            <div class="col-md-3 mb-3">
              <label class="form-label text-secondary" style="font-size: 0.85rem;">ID Number</label>
              <input type="text" class="form-control bg-white" [value]="selectedTenantId()" readonly>
            </div>
            <div class="col-md-3 mb-3">
              <label class="form-label text-secondary" style="font-size: 0.85rem;">Mobile</label>
              <input type="text" class="form-control bg-white" [value]="selectedTenantMobile()" readonly>
            </div>
            <div class="col-md-4 mb-3 d-flex align-items-end">
               <div class="flex-grow-1 me-2">
                 <label class="form-label text-secondary" style="font-size: 0.85rem;">Tenant Birthday</label>
                 <div class="input-group">
                   <input type="text" class="form-control bg-white border-end-0" [value]="selectedTenantBirthday()" readonly>
                   <span class="input-group-text bg-white"><i class="bi bi-calendar"></i></span>
                 </div>
               </div>
               <div class="text-center" style="min-width: 60px; line-height: 1.2;">
                 <small class="d-block text-secondary" style="font-size: 0.75rem;">Age: {{ selectedTenantAge() }}</small>
                 <small class="d-block text-secondary" style="font-size: 0.75rem;">Years</small>
               </div>
            </div>
          </div>
        </fieldset>

        <!-- Sponsor Box -->
        <fieldset class="border rounded p-3 mb-4" style="border-color: #dee2e6 !important;">
          <legend class="float-none w-auto px-2 fs-6 text-secondary fw-bold mb-0" style="font-size: 0.9rem !important;">Sponsor</legend>
          <div class="row g-3">
            <div class="col-md-3 mb-3">
              <label class="form-label text-secondary" style="font-size: 0.85rem;">Sponsor name</label>
              <div class="d-flex align-items-center">
                <select class="form-select" formControlName="sponsorId">
                  <option [value]="null">Select one</option>
                  <option *ngFor="let s of sponsors" [value]="s.id">{{ s.name }}</option>
                </select>
                <span class="ms-2 fs-5 text-teal" style="cursor: pointer;">+</span>
              </div>
            </div>
            <div class="col-md-3 mb-3">
              <label class="form-label text-secondary" style="font-size: 0.85rem;">Nationality</label>
              <div class="d-flex align-items-center">
                <input type="text" class="form-control" formControlName="sponsorNationality" placeholder="Select Nationality">
                <span class="ms-2 fs-5 text-teal" style="cursor: pointer;">+</span>
              </div>
            </div>
            <div class="col-md-3 mb-3">
              <label class="form-label text-secondary" style="font-size: 0.85rem;">License number</label>
              <input type="text" class="form-control" formControlName="sponsorLicenseNumber">
            </div>
            <div class="col-md-3 mb-3">
              <label class="form-label text-secondary" style="font-size: 0.85rem;">License expire date</label>
              <input type="date" class="form-control" formControlName="sponsorLicenseExpireDate">
            </div>
            
            <div class="col-md-3 mb-3">
              <label class="form-label text-secondary" style="font-size: 0.85rem;">ID Number</label>
              <input type="text" class="form-control" formControlName="sponsorIdNumber">
            </div>
            <div class="col-md-3 mb-3">
              <label class="form-label text-secondary" style="font-size: 0.85rem;">ID expire date</label>
              <input type="date" class="form-control" formControlName="sponsorIdExpireDate">
            </div>
          </div>
        </fieldset>

        <!-- Second Driver Box -->
        <fieldset class="border rounded p-3 mb-4" style="border-color: #dee2e6 !important;">
          <legend class="float-none w-auto px-2 fs-6 text-secondary fw-bold mb-0" style="font-size: 0.9rem !important;">Second Driver</legend>
          <div class="row g-3">
            <div class="col-md-3 mb-3">
              <label class="form-label text-secondary" style="font-size: 0.85rem;">Second Driver name</label>
              <div class="d-flex align-items-center">
                <select class="form-select" formControlName="secondDriverId">
                  <option [value]="null">Select one</option>
                  <option *ngFor="let sd of secondDrivers" [value]="sd.id">{{ sd.name }}</option>
                </select>
                <span class="ms-2 fs-5 text-teal" style="cursor: pointer;">+</span>
              </div>
            </div>
            <div class="col-md-3 mb-3">
              <label class="form-label text-secondary" style="font-size: 0.85rem;">Nationality</label>
              <div class="d-flex align-items-center">
                <input type="text" class="form-control" formControlName="secondDriverNationality" placeholder="Select Nationality">
                <span class="ms-2 fs-5 text-teal" style="cursor: pointer;">+</span>
              </div>
            </div>
            <div class="col-md-3 mb-3">
              <label class="form-label text-secondary" style="font-size: 0.85rem;">License number</label>
              <input type="text" class="form-control" formControlName="secondDriverLicenseNumber">
            </div>
            <div class="col-md-3 mb-3">
              <label class="form-label text-secondary" style="font-size: 0.85rem;">License expire date</label>
              <input type="date" class="form-control" formControlName="secondDriverLicenseExpireDate">
            </div>
            
            <div class="col-md-3 mb-3">
              <label class="form-label text-secondary" style="font-size: 0.85rem;">ID Number</label>
              <input type="text" class="form-control" formControlName="secondDriverIdNumber">
            </div>
            <div class="col-md-3 mb-3">
              <label class="form-label text-secondary" style="font-size: 0.85rem;">ID expire date</label>
              <input type="date" class="form-control" formControlName="secondDriverIdExpireDate">
            </div>
          </div>
        </fieldset>
      </div>

      <!-- Vehicle Info Tab -->
      <div [class.d-none]="activeTab !== 'vehicle'">
        <h6 class="text-secondary fw-bold border-bottom pb-2">Vehicle info</h6>
        <div class="row g-3 mb-4">
          <div class="col-md-4 mb-3">
            <label class="form-label">Plate No. <span class="text-danger">*</span></label>
            <ng-select formControlName="rentalVehicleId" 
                       [items]="vehicles" 
                       bindLabel="plateNo" 
                       bindValue="id" 
                       placeholder="Select one"
                       class="border-danger"
                       [searchable]="true">
                <ng-template ng-option-tmp let-item="item">
                    {{ item.plateNo }} <span *ngIf="item.isRented" class="text-danger ms-1">Rented</span>
                </ng-template>
                <ng-template ng-label-tmp let-item="item">
                    {{ item.plateNo }} <span *ngIf="item.isRented" class="text-danger ms-1">Rented</span>
                </ng-template>
            </ng-select>
            <small class="text-danger" *ngIf="form.get('rentalVehicleId')?.touched && form.get('rentalVehicleId')?.invalid">Required</small>
          </div>
          <div class="col-md-3 mb-3">
            <label class="form-label">Model year</label>
            <input type="number" class="form-control bg-light" disabled [value]="selectedVehicleModelYear()">
          </div>
          <div class="col-md-3 mb-3">
            <label class="form-label">File No.</label>
            <input type="text" class="form-control bg-light" disabled [value]="selectedVehicleFileNo()">
          </div>
          <div class="col-md-3 mb-3">
            <label class="form-label">Kilometer counter</label>
            <input type="number" class="form-control bg-light" formControlName="kilometerCounter" readonly>
          </div>
        </div>
        
        <h6 class="text-secondary fw-bold border-bottom pb-2">Rent Price</h6>
        <div class="row g-3 mb-4">
          <div class="col-md-3 mb-3">
            <label class="form-label">Rent Price</label>
            <input type="number" class="form-control" formControlName="rentPrice">
          </div>
          <div class="col-md-3 mb-3">
            <label class="form-label">Discount %</label>
            <input type="number" class="form-control" formControlName="discountPercent">
          </div>
          <div class="col-md-3 mb-3">
            <label class="form-label">Discount amount</label>
            <input type="number" class="form-control bg-light" formControlName="discountAmount" readonly>
          </div>
          <div class="col-md-3 mb-3">
            <label class="form-label">Net Rent Price</label>
            <input type="number" class="form-control bg-light" formControlName="netRentPrice" readonly>
          </div>
        </div>
        
        <h6 class="text-secondary fw-bold border-bottom pb-2">Penalties</h6>
        <div class="row g-3">
          <div class="col-md-3 mb-3">
            <label class="form-label">Delay penalty/Amount Per Hour</label>
            <input type="number" class="form-control" formControlName="delayPenaltyPerHour">
          </div>
          <div class="col-md-3 mb-3">
            <label class="form-label">Allowed Delay Hours</label>
            <input type="number" class="form-control" formControlName="allowedDelayHours">
          </div>
          <div class="col-md-3 mb-3">
            <label class="form-label">Maintenance penalty</label>
            <input type="number" class="form-control" formControlName="maintenancePenalty">
          </div>
          <div class="col-md-3 mb-3">
            <label class="form-label">Accident penalty</label>
            <input type="number" class="form-control" formControlName="accidentPenalty">
          </div>
        </div>
        
        <!-- Private Driver Section -->
        <fieldset class="border rounded p-3 mt-4 mb-4" style="border-color: #dee2e6 !important;">
          <legend class="float-none w-auto px-2 fs-6 text-secondary fw-bold mb-0" style="font-size: 0.9rem !important;">Private Driver</legend>
          <div class="row g-3">
            <div class="col-md-3 mb-3">
              <label class="form-label">Driver Fare</label>
              <input type="number" class="form-control" formControlName="driverFare">
            </div>
            <div class="col-md-3 mb-3">
              <label class="form-label">Driver working Hours Per day</label>
              <input type="number" class="form-control" formControlName="driverWorkingHoursPerDay">
            </div>
            <div class="col-md-3 mb-3">
              <label class="form-label">Driver overtime amount per hour</label>
              <input type="number" class="form-control" formControlName="driverOvertimeAmountPerHour">
            </div>
            <div class="col-md-3 mb-3">
              <label class="form-label">Daily Rate</label>
              <input type="number" class="form-control bg-light" formControlName="dailyRate" readonly>
            </div>
          </div>
        </fieldset>

        <!-- Kilometer Per Day Section -->
        <fieldset class="border rounded p-3 mb-4" style="border-color: #dee2e6 !important;">
          <legend class="float-none w-auto px-2 fs-6 text-secondary fw-bold mb-0" style="font-size: 0.9rem !important;">Kilometer Per Day</legend>
          <div class="row g-3">
            <div class="col-md-4 mb-3">
              <label class="form-label">Kilometer Per Day</label>
              <input type="number" class="form-control" formControlName="kilometerPerDay">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Maximum Kilometer Per Day</label>
              <input type="number" class="form-control" formControlName="maximumKilometerPerDay">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Amount of KM Exceeding the Limit</label>
              <input type="number" class="form-control" formControlName="amountOfKmExceedingLimit">
            </div>
          </div>
        </fieldset>
      </div>

      <!-- Actions -->
      <div class="d-flex justify-content-end mt-4 pt-3 border-top">
        <button type="button" class="btn btn-outline-secondary me-2" (click)="cancel()">Cancel</button>
        <button type="submit" class="btn btn-success px-4">Save Contract</button>
      </div>
    </form>
  </div>
</div>
