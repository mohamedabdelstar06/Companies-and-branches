<p-table (onLazyLoad)="onLazyLoad($event)" [lazy]="true" [value]="(datasource.data$ | async) || []"
    [totalRecords]="(datasource.totalCount$ | async) || 0" [paginator]="true" [rows]="10"
    (selectionChange)="onSelectionChanged && onSelectionChanged.emit($event)" [showCurrentPageReport]="true"
    [currentPageReportTemplate]="'paginator.current_page_template' | translate" [rowsPerPageOptions]="[5, 10, 20]"
    [responsive]="true" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
        <tr>
            <th style="width: 2rem"><p-tableHeaderCheckbox /></th>
            <th *ngFor="let column of columns"
                [pSortableColumn]="(column.sortable !== false) ? (column.sortField || column.field) : undefined">
                {{ column.header | translate }}
                <button class="btn btn-link p-0 ms-2" *ngIf="column.filterComponent">
                    <i class="pi pi-filter"></i>
                </button>
                <ng-container *ngIf="column.sortable !== false">
                    <p-sortIcon [field]="column.sortField || column.field"></p-sortIcon>
                </ng-container>
            </th>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-row>
        <tr>
            <td>
                <p-tableCheckbox [value]="row" />
            </td>
            <td *ngFor="let column of columns">
                @if (column.component)
                {
                <ng-container *ngComponentOutlet="column.component; inputs: { context:{
                        row,
                        params: column.params,
                        field: column.field,
                        value: column.field ? row[column.field] : null
                      }}"></ng-container>
                }
                @else
                {
            <td>{{ row[column.field!] }}</td>
            }
            </td>
        </tr>
    </ng-template>
</p-table>
<p-progressBar *ngIf="datasource.loading$ | async" mode="indeterminate" [style]="{ height: '4px' }"></p-progressBar>
