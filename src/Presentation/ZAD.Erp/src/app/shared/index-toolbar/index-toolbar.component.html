<div class="main-title mb-2 d-flex justify-content-between align-items-center">
    @if (createButtonTemplate)
    {
    <ng-container *ngTemplateOutlet="createButtonTemplate" [authorize]="claims.create"></ng-container>
    }
    @else
    {
    <button [routerLink]="['add']" class="btn btn-sm btn-primary" type="button" [authorize]="claims.create">
        <i class="fa-solid fa-plus me-2"></i>
        {{ 'general.create_new' | translate }}
    </button>
    }
    <div>
        @if (selectedRows.length > 0) {
        <ng-container *ngTemplateOutlet="bulkActions"></ng-container>
        }
        <button class="btn btn-light text-info me-1" [title]="'general.print' | translate" type="button"
            (click)="print()" [authorize]="claims.print">
            <i class="fa-solid fa-print"></i>
        </button>
        <button class="btn btn-light text-success me-1" [title]="'general.export_to_excel' | translate" type="button"
            (click)="exportToExcel()" [authorize]="claims.export">
            <i class="fa-regular fa-file-excel"></i>
        </button>
        <button class="btn btn-light text-dark me-1" [title]="'general.export' | translate" type="button"
            [authorize]="claims.export">
            <i class="fa-solid fa-download"></i>
        </button>
        <button class="btn btn-light text-dark me-1" [title]="'general.import' | translate" type="button"
            [authorize]="claims.import">
            <i class="fa-solid fa-upload"></i>
        </button>
    </div>
</div>

<!-- For bulk actions -->
<ng-template #bulkActions>
    @if (isConfirm) {
    <ng-container *ngTemplateOutlet="bulkTransactionActions"></ng-container>
    }
    @else {
    <ng-container *ngTemplateOutlet="bulkDefinitionActions"></ng-container>
    }
    <button class="btn btn-light text-danger me-1" [title]="'general.delete' | translate" type="button"
        (click)="deleteBulk()" [authorize]="claims.delete">
        <i class="fa-regular fa-trash-can"></i>
    </button>
</ng-template>

<!-- For definition / configuration pages -->
<ng-template #bulkDefinitionActions>
    <button class="btn btn-light text-success me-1" [title]="'general.activate' | translate" type="button"
        (click)="activateBulk()" [authorize]="claims.activate">
        <i class="fa-regular fa-circle-check"></i>
    </button>
    @if (deactivateButtonTemplate)
    {
    <ng-container *ngTemplateOutlet="deactivateButtonTemplate" [authorize]="claims.deactivate"></ng-container>
    }
    @else {
    <button class="btn btn-light text-danger me-1" [title]="'general.deactivate' | translate" type="button"
        (click)="deactivateBulk()" [authorize]="claims.deactivate">
        <i class="fa-regular fa-circle-xmark"></i>
    </button>
    }
</ng-template>

<!-- For transactions pages -->
<ng-template #bulkTransactionActions>
    <button class="btn btn-light text-success me-1" [title]="'general.confirm' | translate" type="button"
        (click)="confirmBulk()" [authorize]="claims.confirm">
        <i class="fa-regular fa-thumbs-up"></i>
    </button>
    @if (unconfirmButtonTemplate)
    {
    <ng-container *ngTemplateOutlet="unconfirmButtonTemplate" [authorize]="claims.unconfirm"></ng-container>
    }
    @else {
    <button class="btn btn-light text-danger me-1" [title]="'general.unconfirm' | translate" type="button"
        (click)="unconfirmBulk()" [authorize]="claims.unconfirm">
        <i class="fa-regular fa-thumbs-down"></i>
    </button>
    }
</ng-template>
