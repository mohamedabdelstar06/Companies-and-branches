<div class="p-4 pb-0">
    <div class=" text-center">
        <span class="icon">
            @if (config.data!.iconClass) {
            <i class="{{config.data!.iconClass}}"></i>
            }
            @else {
            <i class="{{iconClass}} text-{{typeClass}}"></i>
            }
        </span>
        <h4>{{config.header}}</h4>
        <p class="lead text-center">{{config.data!.message}}</p>

        @if (config.data!.showInput) {
        <textarea [(ngModel)]="config.data!.inputValue" class="form-control mt-3" rows="4"></textarea>
        }
    </div>
    <div class="d-flex justify-content-center gap-2">
        <button type="button" class="btn btn-{{typeClass}}" (click)="confirm()">
            {{config.data!.confirmButtonText}}
        </button>
        @if (config.data!.cancelButtonText) {
        <button type="button" class="btn btn-outline-secondary" (click)="cancel()">
            {{config.data!.cancelButtonText}}
        </button>
        }
    </div>
</div>
