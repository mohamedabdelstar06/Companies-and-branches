<div class="login-bg d-flex flex-column justify-content-center align-items-center" style="min-height: 100vh;">
      <div class="card shadow-sm border-0" style="width: 420px; padding: 2.5rem; border-radius: 12px;">
        
        <div class="text-center mb-4">
          <h1 class="fw-bold m-0" style="color: #176B6B; font-size: 4.5rem; letter-spacing: -3px; line-height: 1;">Z<span style="font-style: italic;">A</span>D</h1>
        </div>
        
        <div class="mb-3 text-start">
          <label class="form-label fw-bold mb-1" style="color: #333; font-size: 0.85rem;">Company</label>
          <select class="form-select text-secondary border-secondary-subtle" style="border-radius: 4px; padding: 0.5rem 2.25rem 0.5rem 0.75rem;" [(ngModel)]="selectedCompanyId" (change)="onCompanyChange()">
            <option [ngValue]="null"></option>
            <option *ngFor="let comp of companies" [value]="comp.id">{{comp.name}}</option>
          </select>
        </div>

        <div class="mb-4 text-start">
          <label class="form-label fw-bold mb-1" style="color: #333; font-size: 0.85rem;">Branch</label>
          <select class="form-select text-secondary border-secondary-subtle" style="border-radius: 4px; padding: 0.5rem 2.25rem 0.5rem 0.75rem;" [(ngModel)]="selectedBranchId" [disabled]="!selectedCompanyId">
            <option [ngValue]="null"></option>
            <option *ngFor="let branch of filteredBranches" [value]="branch.id">{{branch.name}}</option>
          </select>
        </div>

        <button class="btn w-100 mb-2" 
                style="background-color: #176B6B; color: white; border: none; font-size: 0.95rem; padding: 0.6rem; border-radius: 4px;"
                (click)="enterModule()">
          Continue
        </button>

        <button class="btn w-100 bg-white text-secondary" 
                style="border: 1px solid #ced4da; font-size: 0.95rem; padding: 0.6rem; border-radius: 4px;"
                (click)="onSkip()">
          Skip
        </button>
      </div>
      
      <div class="mt-4 text-center">
         <small class="text-muted" style="font-size: 0.8rem;">Copy rights reserved to Zad Company</small>
      </div>
    </div>
